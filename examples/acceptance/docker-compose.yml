services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sqlgen
      POSTGRES_PASSWORD: sqlgen
      POSTGRES_DB: sqlgen_acceptance
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlgen -d sqlgen_acceptance"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
